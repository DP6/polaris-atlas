<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Aplica o tema (dark por padrão) antes do primeiro paint —
         bloqueante de propósito, senão o app renderia um flash no tema
         errado até o React montar e o hook useTheme rodar. Chave e
         lógica espelham hooks/useTheme.ts; se um dia esse arquivo mudar
         de nome/chave, atualizar aqui também. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('observability-hub:theme')
          if (stored === 'light') return
        } catch (e) {}
        document.documentElement.classList.add('dark')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Observability Hub — dp6</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

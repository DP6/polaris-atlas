name: Backend Deploy (dev)

on:
  push:
    branches-ignore:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-deploy-dev.yml"
  # Permite redeployar o commit atual sem precisar de um push que toque
  # apps/backend/** — usado, por exemplo, quando o serviço Cloud Run é
  # criado depois que a imagem já existe e precisa de um primeiro deploy.
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: dp6-ci-polaris
  REGION: us-central1
  REPOSITORY: apps
  SERVICE: backend-dev
  # Cloud Run Job de refresh do cache de audit log (lineage/access) —
  # mesma imagem do Service, promovida junto (ver
  # infra/terraform/modules/cloud-run-job e
  # apps/backend/src/atlas/jobs/refresh_event_cache.py).
  REFRESH_CACHE_JOB: backend-dev-refresh-cache

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SA_DEV }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        working-directory: apps/backend
        run: |
          docker build -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ github.sha }}" .

      - name: Push image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ github.sha }}" \
            --quiet

      - name: Update refresh-cache Cloud Run Job
        run: |
          gcloud run jobs update "${REFRESH_CACHE_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ github.sha }}" \
            --quiet

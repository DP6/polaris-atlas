<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Observability Hub — descritivo do produto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap');

  :root {
    --color-primary: #FFB302;
    --color-bg-dark: #1D1D1B;
    --color-bg-surface: #2A2A28;
    --color-bg-muted: #3A3A38;
    --color-text-primary: #FFFFFF;
    --color-text-muted: #8F96A1;
    --color-text-inverse: #1D1D1B;
    --font-sans: 'Ubuntu', 'Verdana', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg-dark);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    overflow: hidden;
  }

  .deck {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.deck-header {
    height: 56px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--color-bg-dark);
    border-bottom: 2px solid var(--color-primary);
  }

  .deck-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
  }

  .deck-brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--color-primary);
  }

  .deck-counter {
    font-size: 0.875rem;
    color: var(--color-text-muted);
    font-variant-numeric: tabular-nums;
  }

  main.slides {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 48px 64px;
    opacity: 0;
    transform: translateX(24px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }

  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .slide.leaving {
    transform: translateX(-24px);
  }

  .slide-figure {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide-figure img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 0 0 1px var(--color-bg-muted), 0 24px 64px rgba(0, 0, 0, 0.5);
  }

  .slide-caption {
    flex: 0 0 auto;
    max-width: 780px;
    text-align: center;
  }

  .slide-caption .domain-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-inverse);
    background: var(--color-primary);
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 12px;
  }

  .slide-caption h2 {
    margin: 0 0 8px;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .slide-caption p {
    margin: 0;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--color-text-muted);
  }

  /* Slide de título/divisor — sem screenshot, texto centralizado */
  .slide.title-slide .slide-figure {
    display: none;
  }

  .slide.title-slide .slide-caption {
    max-width: 640px;
  }

  .slide.title-slide h2 {
    font-size: 2.25rem;
  }

  .slide.title-slide p {
    font-size: 1.125rem;
  }

  nav.deck-nav {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px 24px 24px;
  }

  .nav-btn {
    appearance: none;
    border: none;
    background: var(--color-bg-surface);
    color: var(--color-text-primary);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.125rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--color-bg-muted);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .dots {
    display: flex;
    gap: 6px;
    max-width: 420px;
    overflow-x: auto;
    padding: 4px;
  }

  .dot-btn {
    appearance: none;
    border: none;
    background: var(--color-bg-muted);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .dot-btn.active {
    background: var(--color-primary);
    transform: scale(1.3);
  }

  @media (max-width: 640px) {
    .slide { padding: 16px 20px 48px; }
    .slide-caption h2 { font-size: 1.25rem; }
    .dots { display: none; }
  }
</style>
</head>
<body>
  <div class="deck">
    <header class="deck-header">
      <div class="deck-brand"><span class="dot"></span> Observability Hub</div>
      <div class="deck-counter"><span id="current-index">1</span> / <span id="total-slides">1</span></div>
    </header>

    <main class="slides" id="slides"></main>

    <nav class="deck-nav">
      <button class="nav-btn" id="prev-btn" aria-label="Slide anterior">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="next-btn" aria-label="Próximo slide">›</button>
    </nav>
  </div>

  <script>
    // Cada slide: { title, description, image (opcional — ausente = slide de
    // título/divisor), domain (opcional — tag exibida acima do título) }.
    const slides = [
      {
        title: "Observability Hub",
        description: "Plataforma de observabilidade de dados no GCP — catálogo, qualidade, lineage, PII, acesso, freshness, FinOps e Cloud Storage em um só lugar.",
      },
    ];

    const slidesEl = document.getElementById('slides');
    const dotsEl = document.getElementById('dots');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const currentIndexEl = document.getElementById('current-index');
    const totalSlidesEl = document.getElementById('total-slides');

    let current = 0;

    function renderSlides() {
      slidesEl.innerHTML = '';
      dotsEl.innerHTML = '';

      slides.forEach((slide, i) => {
        const section = document.createElement('section');
        section.className = 'slide' + (slide.image ? '' : ' title-slide');
        section.dataset.index = i;

        const figure = document.createElement('div');
        figure.className = 'slide-figure';
        if (slide.image) {
          const img = document.createElement('img');
          img.src = 'images/' + slide.image;
          img.alt = slide.title;
          figure.appendChild(img);
        }
        section.appendChild(figure);

        const caption = document.createElement('div');
        caption.className = 'slide-caption';
        caption.innerHTML =
          (slide.domain ? `<span class="domain-tag">${slide.domain}</span>` : '') +
          `<h2>${slide.title}</h2><p>${slide.description}</p>`;
        section.appendChild(caption);

        slidesEl.appendChild(section);

        const dot = document.createElement('button');
        dot.className = 'dot-btn';
        dot.setAttribute('aria-label', `Ir para slide ${i + 1}`);
        dot.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(dot);
      });

      totalSlidesEl.textContent = slides.length;
      update();
    }

    function update() {
      const sections = slidesEl.querySelectorAll('.slide');
      const dots = dotsEl.querySelectorAll('.dot-btn');
      sections.forEach((s, i) => {
        s.classList.toggle('active', i === current);
        s.classList.toggle('leaving', i < current);
      });
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
      currentIndexEl.textContent = current + 1;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
    }

    function goTo(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      update();
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
      if (e.key === 'ArrowLeft') goTo(current - 1);
    });

    renderSlides();
  </script>
</body>
</html>

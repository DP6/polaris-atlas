<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Observability Hub — demonstrativo do produto</title>
<link rel="icon" type="image/png" href="../assets/favicon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap');

  :root {
    --color-primary: #FFB302;
    --color-bg-page: #FFFFFF;
    --color-bg-surface: #F7F7F5;
    --color-bg-muted: #ECECE9;
    --color-border: #E2E2DE;
    --color-text-primary: #1D1D1B;
    --color-text-muted: #5B626C;
    --color-text-inverse: #1D1D1B;
    --font-sans: 'Ubuntu', 'Verdana', system-ui, sans-serif;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    overflow: hidden;
  }

  svg { display: block; }

  /* --- Barra de 4 abas do site (produto / guia técnico / componentes /
     desenvolvimento) — igual nas quatro páginas. */
  .page { display: flex; flex-direction: column; height: 100vh; }

  /* Compacta só nesta página (produto) — libera mais altura pro conteúdo
     principal, que é o foco aqui; as outras 3 páginas mantêm 44px. */
  .site-tabs {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 32px;
    padding: 0 12px;
    background: var(--color-text-primary);
    border-bottom: 2px solid var(--color-primary);
  }

  .site-tabs-brand {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-weight: 700;
    font-size: 0.75rem;
    margin-right: 10px;
    white-space: nowrap;
  }

  .site-tabs-brand .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-primary);
    flex: 0 0 auto;
  }

  .site-tabs a {
    color: rgba(255, 255, 255, 0.72);
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .site-tabs a:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .site-tabs a.active {
    background: var(--color-primary);
    color: var(--color-text-inverse);
  }

  .app {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* --- Sidebar de navegação (scroll vertical), recolhível --------------- */

  .sidebar {
    width: 288px;
    flex: 0 0 auto;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--color-bg-surface);
    border-right: 1px solid var(--color-border);
    padding-bottom: 24px;
    transition: width 0.18s ease;
  }

  .app.sidebar-collapsed .sidebar {
    width: 0;
    border-right: none;
  }

  .sidebar-toggle {
    position: absolute;
    top: 10px;
    left: 288px;
    transform: translateX(-50%);
    z-index: 5;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    background: #fff;
    box-shadow: 0 2px 6px rgba(29, 29, 27, 0.14);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--color-text-primary);
    transition: left 0.18s ease;
    padding: 0;
  }

  .sidebar-toggle:hover {
    background: var(--color-bg-muted);
  }

  .app.sidebar-collapsed .sidebar-toggle {
    left: 8px;
    transform: none;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 16px;
    font-weight: 700;
    border-bottom: 2px solid var(--color-primary);
    position: sticky;
    top: 0;
    background: var(--color-bg-surface);
    z-index: 1;
  }

  .sidebar-brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--color-primary);
    flex: 0 0 auto;
  }

  .sidebar-group-label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 16px 16px 4px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-text-muted);
  }

  .sidebar-group-label svg { width: 13px; height: 13px; flex: 0 0 auto; }

  .sidebar-item {
    display: block;
    width: 100%;
    text-align: left;
    text-decoration: none;
    appearance: none;
    border: none;
    background: none;
    cursor: pointer;
    padding: 7px 16px 7px 18px;
    font-size: 0.8125rem;
    line-height: 1.3;
    color: var(--color-text-muted);
    border-left: 3px solid transparent;
    font-family: inherit;
    box-sizing: border-box;
  }

  .sidebar-item:hover {
    background: var(--color-bg-muted);
    color: var(--color-text-primary);
  }

  .sidebar-item.active {
    background: var(--color-bg-muted);
    border-left-color: var(--color-primary);
    color: var(--color-text-primary);
    font-weight: 700;
  }

  .sidebar-item.divider-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.75rem;
    padding-top: 12px;
    padding-bottom: 12px;
    margin-top: 6px;
    color: var(--color-text-primary);
    border-left: 3px solid var(--color-primary);
  }

  .sidebar-item.divider-item svg { width: 15px; height: 15px; flex: 0 0 auto; }

  /* --- Área principal ----------------------------------------------------- */

  .main {
    flex: 1 1 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* --- Slides em fluxo contínuo (scroll), não mais um-por-vez ------------ */

  main.slides {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .slide {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 28px 40px 24px;
    border-bottom: 1px solid var(--color-border);
    scroll-margin-top: 12px;
  }

  .slide-caption {
    flex: 0 0 auto;
    max-width: 940px;
  }

  .slide-caption .domain-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-inverse);
    background: var(--color-primary);
    border-radius: 999px;
    padding: 3px 11px 3px 9px;
    margin-bottom: 8px;
  }

  .slide-caption .domain-tag svg { width: 13px; height: 13px; }

  .slide-caption h2 {
    margin: 0 0 4px;
    font-size: 1.375rem;
    font-weight: 700;
  }

  .slide-caption p {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.45;
    color: var(--color-text-muted);
  }

  .slide-figure {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .slide-figure img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    box-shadow: 0 18px 44px rgba(29, 29, 27, 0.16);
    cursor: zoom-in;
  }

  /* Slide de capa / encerramento — sem screenshot, texto centralizado, com o
     grafismo da marca DP6 ocupando a largura toda ao fundo. Mesmo padrão da
     hero do Polaris (grafismo em marca d'água + texto por cima), adaptado ao
     fundo claro deste site. */
  .slide.title-slide {
    position: relative;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--color-bg-surface);
  }

  .slide.title-slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('../assets/dp6-grafismo.png') no-repeat center;
    background-size: 118% auto;
    opacity: 0.08;
    pointer-events: none;
  }

  .slide.title-slide .slide-caption {
    position: relative;
    z-index: 1;
    max-width: 720px;
  }

  .slide.title-slide h2 {
    font-size: clamp(2rem, 5vw, 3.25rem);
    letter-spacing: -0.02em;
  }

  .slide.title-slide p {
    font-size: 1.125rem;
  }

  /* Os domínios do app em chips — o eco da faixa "Nossas áreas" da hero do
     Polaris, citando o que o Hub cobre. */
  .cover-topics { margin-top: 28px; }

  .cover-topics-label {
    display: block;
    margin-bottom: 12px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }

  .cover-topics-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .cover-chip {
    font-size: 0.8125rem;
    font-weight: 700;
    padding: 5px 12px;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    color: var(--color-text-primary);
  }

  /* Slide divisor de seção ("contracapa") */
  .slide.divider-slide {
    position: relative;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--color-primary);
    margin: 0;
  }

  /* Grafismo da marca DP6 por cima do amarelo — só as linhas (o PNG tem fundo
     furado), em preto bem leve pra combinar com o texto escuro do divisor. */
  .slide.divider-slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('../assets/dp6-grafismo.png') no-repeat center / 118% auto;
    filter: brightness(0);
    opacity: 0.1;
    pointer-events: none;
  }

  .slide.divider-slide .slide-caption {
    max-width: 640px;
    position: relative;
    z-index: 1;
  }

  .slide.divider-slide .domain-tag {
    background: var(--color-text-inverse);
    color: var(--color-primary);
  }

  .slide.divider-slide h2 {
    font-size: 3rem;
    color: var(--color-text-inverse);
  }

  .slide.divider-slide p {
    font-size: 1.125rem;
    color: var(--color-text-inverse);
    opacity: 0.85;
  }

  .divider-icon {
    position: absolute;
    right: -48px;
    bottom: -72px;
    opacity: 0.14;
    pointer-events: none;
    color: var(--color-text-inverse);
  }

  .divider-icon svg { width: 340px; height: 340px; stroke-width: 1.4; }

  /* --- Lightbox ------------------------------------------------------------ */

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 15, 14, 0.92);
    align-items: center;
    justify-content: center;
    padding: 32px;
    cursor: zoom-out;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: 4px;
  }

  .lightbox-close {
    position: fixed;
    top: 20px;
    right: 24px;
    appearance: none;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.25rem;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .sidebar-toggle { display: none; }
    .slide { padding: 20px 20px 20px; }
    .slide-caption h2 { font-size: 1.125rem; }
    .site-tabs { overflow-x: auto; }
    .site-tabs-brand { display: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="site-tabs">
      <span class="site-tabs-brand"><span class="dot"></span> Observability Hub</span>
      <a href="../produto/" class="active">Demonstrativo do produto</a>
      <a href="../tecnico/">Guia técnico</a>
      <a href="../componentes/">Componentes</a>
      <a href="../desenvolvimento/">Desenvolvimento</a>
    </header>

    <div class="app" id="app">
      <nav class="sidebar" id="sidebar"></nav>
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Ocultar menu">‹</button>

      <div class="main">
        <main class="slides" id="slides"></main>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Fechar">✕</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script>
    // --- Ícones (lucide, MIT) por domínio / divisor de seção -------------
    const P = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    const ICONS = {
      "Acesso": `<svg ${P}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>`,
      "Catálogo de Dados": `<svg ${P}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>`,
      "Qualidade": `<svg ${P}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>`,
      "Governança": `<svg ${P}><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>`,
      "FinOps": `<svg ${P}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
      "Cloud Storage": `<svg ${P}><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>`,
      "Favoritos": `<svg ${P}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
      "Favoritos e Recentes": `<svg ${P}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
      "Administração": `<svg ${P}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      "BigQuery": `<svg ${P}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>`,
    };

    // Cada slide: { title, description, image (opcional), domain (opcional,
    // vira badge com ícone acima do título), topics (opcional, só nos slides
    // de capa/encerramento — lista de domínios em chips, com topicsLabel), type
    // ('divider' = contracapa de seção, ausente + sem image = capa/encerramento,
    // ausente + com image = tela normal do produto) }.
    const slides = [
      {
        title: "Observability Hub",
        description: "Plataforma de observabilidade de dados no GCP: um só lugar pra saber o que existe nos datasets, se está saudável, quem usou, quanto custa e o que dá pra economizar — sem escrever uma query. Este é um tour pelas telas do produto.",
        topicsLabel: "O que o Hub cobre",
        topics: ["Catálogo de Dados", "Qualidade e schema drift", "Lineage e tabelas órfãs", "Fingerprint de PII", "Mapa de acesso", "Freshness com SLA", "FinOps", "Cloud Storage", "Favoritos e Recentes", "Administração"],
      },
      {
        title: "Login",
        domain: "Acesso",
        description: "Acesso via conta Google (OAuth) — sem senha própria, sem cadastro manual. Quem pode entrar é controlado por uma allowlist de domínio.",
        image: "01-login.png",
      },

      {
        type: "divider",
        title: "BigQuery",
        description: "Catálogo de Dados, análise de tabela (qualidade, PII, lineage), governança e FinOps — tudo que o Hub observa em datasets e tabelas do BigQuery.",
      },
      {
        title: "Catálogo de Dados — visão geral",
        domain: "Catálogo de Dados",
        description: "A porta de entrada: total de datasets, tabelas e volume ocupado no projeto, busca de tabela por qualquer dataset e a grade de datasets com a distribuição de SLA de freshness de cada um — tudo sem escrever uma query.",
        image: "02-catalogo-visao-geral.png",
      },
      {
        title: "Busca de tabelas",
        domain: "Catálogo de Dados",
        description: "Procura uma tabela ou partição em todos os datasets do projeto de uma vez, com quatro modos de comparação — igual a, contém, não contém, diferente de. Útil pra checar a cobertura de um pipeline.",
        image: "03-catalogo-busca.png",
      },
      {
        title: "Dataset",
        domain: "Catálogo de Dados",
        description: "Inventário de um dataset — região, nº de tabelas e views, tamanho, linhas e a pior faixa de freshness. Cada linha tem 'Ver partições' e 'Analisar', que abre o módulo de análise da tabela.",
        image: "04-catalogo-dataset.png",
      },
      {
        title: "Partições de uma tabela",
        domain: "Catálogo de Dados",
        description: "Linhas por partição de uma tabela particionada, sem rodar SQL — útil pra confirmar se a carga do dia chegou ou achar uma partição vazia.",
        image: "05-catalogo-particoes.png",
      },

      {
        title: "Análise de uma tabela",
        domain: "Qualidade",
        description: "Ao abrir uma tabela pra analisar, sete módulos num só lugar: schema, análise de qualidade, fingerprint de PII, sugestão de tipo de coluna, histórico, mapa de acesso e lineage.",
        image: "06-analise-chooser.png",
      },
      {
        title: "Schema",
        domain: "Qualidade",
        description: "Nome, tipo e nullability de cada coluna, com marcação de partição e cluster — direto do INFORMATION_SCHEMA, sem custo de query.",
        image: "07-qualidade-schema.png",
      },
      {
        title: "Configurar o profiling",
        domain: "Qualidade",
        description: "Antes de rodar: amostragem, método de unicidade (exato ou aproximado por HLL) e coluna de data. Nada é executado sem passar por aqui.",
        image: "08-qualidade-config.png",
      },
      {
        title: "SQL gerado e custo estimado",
        domain: "Qualidade",
        description: "O Hub mostra o SQL exato que vai rodar e estima bytes processados e custo em US$ — a decisão de gastar a query é sempre do usuário, nunca surpresa na fatura.",
        image: "09-qualidade-sql-custo.png",
      },
      {
        title: "Resultado do profiling",
        domain: "Qualidade",
        description: "Completude, unicidade (HLL) e duplicatas coluna a coluna, com o tipo lógico detectado (data, categórica, chave, numérica…) e uma flag de qualidade por coluna.",
        image: "10-qualidade-resultado.png",
      },
      {
        title: "Quality Score e cardinalidade",
        domain: "Qualidade",
        description: "Um score composto (completude média, densidade geral e cobertura de tipo lógico) e a cardinalidade aproximada de cada coluna, com a contagem exata no hover.",
        image: "11-qualidade-score.png",
      },
      {
        title: "Histórico de profiling",
        domain: "Qualidade",
        description: "Toda execução fica salva — a evolução de densidade e duplicatas ao longo do tempo pega regressão de qualidade cedo.",
        image: "12-qualidade-historico.png",
      },
      {
        title: "Fingerprint de PII",
        domain: "Qualidade",
        description: "Escaneia por heurística de nome + amostra real de dado (via TABLESAMPLE), contando matches de padrão dentro do próprio BigQuery — a API do Hub só recebe contagens agregadas, nunca o valor da coluna.",
        image: "13-pii.png",
      },
      {
        title: "Mapa de acesso",
        domain: "Qualidade",
        description: "Quem leu ou escreveu na tabela nos últimos 30 dias, via audit log — confirma se ela ainda tem consumidor antes de arquivar, apagar ou mudar o schema.",
        image: "14-mapa-acesso.png",
      },
      {
        title: "Lineage",
        domain: "Qualidade",
        description: "Grafo de dependência em tela cheia, reconstruído dos jobs de LOAD / QUERY / EXTRACT do BigQuery — com painéis de impacto de mudança de schema, fontes e consumidores diretos, e buckets do GCS como nó.",
        image: "15-lineage.png",
      },
      {
        title: "Pastas de profiling",
        domain: "Qualidade",
        description: "Recortes de runs de profiling salvos em pastas nomeadas, pra comparar depois — ex: métodos de unicidade ou janelas de data diferentes de uma mesma tabela.",
        image: "16-qualidade-pastas.png",
      },
      {
        title: "Pasta de comparação",
        domain: "Qualidade",
        description: "Cada pasta guarda uma cópia do resultado no momento em que foi salvo — uma mudança futura na lógica de profiling não altera retroativamente o que já está arquivado.",
        image: "17-qualidade-pasta-detalhe.png",
      },

      {
        title: "Governança — visão geral",
        domain: "Governança",
        description: "Freshness com SLA e tabelas sem consumidor conhecido — as duas frentes de governança do catálogo, cada uma no seu card.",
        image: "18-governanca-visao-geral.png",
      },
      {
        title: "Freshness com SLA",
        domain: "Governança",
        description: "Cada tabela classificada contra faixas de SLA fixas (12h, 24h, 48h, 7 dias, 1 mês) a partir da última modificação — a distribuição de cada dataset em três barras: no prazo, atenção, estourado.",
        image: "19-freshness.png",
      },
      {
        title: "Tabelas sem consumidor — escopo",

    const slidesEl = document.getElementById('slides');
    const sidebarEl = document.getElementById('sidebar');
    const appEl = document.getElementById('app');
    const sidebarToggle = document.getElementById('sidebar-toggle');

    function slideClass(slide) {
      if (slide.type === 'divider') return 'slide divider-slide';
      if (!slide.image) return 'slide title-slide';
      return 'slide';
    }

    function renderSlides() {
      slidesEl.innerHTML = '';
      sidebarEl.innerHTML = '<div class="sidebar-brand"><span class="dot"></span> Observability Hub</div>';

      let lastGroupLabel = null;

      slides.forEach((slide, i) => {
        // --- slide em si ---
        const section = document.createElement('section');
        section.className = slideClass(slide);
        section.id = 'slide-' + i;

        const caption = document.createElement('div');
        caption.className = 'slide-caption';
        const tag = slide.domain
          ? `<span class="domain-tag">${ICONS[slide.domain] || ''}<span>${slide.domain}</span></span>`
          : '';
        const topics = slide.topics
          ? `<div class="cover-topics"><span class="cover-topics-label">${slide.topicsLabel || 'No app'}</span>` +
            `<div class="cover-topics-list">${slide.topics.map((t) => `<span class="cover-chip">${t}</span>`).join('')}</div></div>`
          : '';
        caption.innerHTML = tag + `<h2>${slide.title}</h2><p>${slide.description}</p>` + topics;
        section.appendChild(caption);

        if (slide.type === 'divider') {
          const wm = document.createElement('div');
          wm.className = 'divider-icon';
          wm.innerHTML = ICONS[slide.title] || '';
          section.appendChild(wm);
        }

        if (slide.image) {
          const figure = document.createElement('div');
          figure.className = 'slide-figure';
          const img = document.createElement('img');
          img.src = 'images/' + slide.image;
          img.alt = slide.title;
          img.loading = 'lazy';
          img.addEventListener('click', () => openLightbox(img.src, img.alt));
          figure.appendChild(img);
          section.appendChild(figure);
        }

        slidesEl.appendChild(section);

        // --- item da sidebar (âncora, igual às outras páginas do site) ---
        if (slide.type === 'divider') {
          const item = document.createElement('a');
          item.className = 'sidebar-item divider-item';
          item.href = '#slide-' + i;
          item.innerHTML = (ICONS[slide.title] || '') + `<span>${slide.title}</span>`;
          sidebarEl.appendChild(item);
          lastGroupLabel = null;
        } else {
          const groupLabel = slide.domain || null;
          if (groupLabel && groupLabel !== lastGroupLabel) {
            const label = document.createElement('div');
            label.className = 'sidebar-group-label';
            label.innerHTML = (ICONS[groupLabel] || '') + `<span>${groupLabel}</span>`;
            sidebarEl.appendChild(label);
            lastGroupLabel = groupLabel;
          }
          if (!groupLabel) lastGroupLabel = null;

          const item = document.createElement('a');
          item.className = 'sidebar-item';
          item.href = '#slide-' + i;
          item.textContent = slide.title;
          sidebarEl.appendChild(item);
        }
      });

      setupScrollspy();
    }

    // Scrollspy: destaca no sidebar a seção visível durante o scroll —
    // root é main.slides (o próprio container com scroll), não a viewport.
    function setupScrollspy() {
      const sections = slidesEl.querySelectorAll('.slide[id]');
      const sidebarItems = sidebarEl.querySelectorAll('.sidebar-item');
      const itemById = {};
      sidebarItems.forEach((item) => {
        itemById[item.getAttribute('href').slice(1)] = item;
      });

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const item = itemById[entry.target.id];
            if (!item) return;
            if (entry.isIntersecting) {
              sidebarItems.forEach((a) => a.classList.remove('active'));
              item.classList.add('active');
              item.scrollIntoView({ block: 'nearest' });
            }
          });
        },
        { root: slidesEl, rootMargin: '-20% 0px -70% 0px' },
      );
      sections.forEach((s) => observer.observe(s));
    }

    // Estado do menu compartilhado com as outras abas do site (localStorage).
    const MENU_KEY = 'oh-site:menu-collapsed';
    function syncSidebarToggle(collapsed) {
      appEl.classList.toggle('sidebar-collapsed', collapsed);
      sidebarToggle.textContent = collapsed ? '›' : '‹';
      sidebarToggle.setAttribute('aria-label', collapsed ? 'Mostrar menu' : 'Ocultar menu');
    }
    try { syncSidebarToggle(localStorage.getItem(MENU_KEY) === '1'); } catch (e) {}
    sidebarToggle.addEventListener('click', () => {
      const collapsed = !appEl.classList.contains('sidebar-collapsed');
      syncSidebarToggle(collapsed);
      try { localStorage.setItem(MENU_KEY, collapsed ? '1' : '0'); } catch (e) {}
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightbox.addEventListener('click', closeLightbox);
    lightboxClose.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    renderSlides();
  </script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Observability Hub — descritivo do produto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap');

  :root {
    --color-primary: #FFB302;
    --color-bg-page: #FFFFFF;
    --color-bg-surface: #F7F7F5;
    --color-bg-muted: #ECECE9;
    --color-border: #E2E2DE;
    --color-text-primary: #1D1D1B;
    --color-text-muted: #5B626C;
    --color-text-inverse: #1D1D1B;
    --font-sans: 'Ubuntu', 'Verdana', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    overflow: hidden;
  }

  /* --- Barra de 4 abas do site (produto / guia técnico / componentes /
     desenvolvimento) — igual nas quatro páginas, ver docs/site/README
     internamente nos comentários de cada index.html. */
  .page { display: flex; flex-direction: column; height: 100vh; }

  /* Compacta só nesta página (produto) — libera mais altura pro conteúdo
     principal, que é o foco aqui; as outras 3 páginas mantêm 44px. */
  .site-tabs {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 32px;
    padding: 0 12px;
    background: var(--color-text-primary);
    border-bottom: 2px solid var(--color-primary);
  }

  .site-tabs-brand {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-weight: 700;
    font-size: 0.75rem;
    margin-right: 10px;
    white-space: nowrap;
  }

  .site-tabs-brand .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-primary);
    flex: 0 0 auto;
  }

  .site-tabs a {
    color: rgba(255, 255, 255, 0.72);
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .site-tabs a:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .site-tabs a.active {
    background: var(--color-primary);
    color: var(--color-text-inverse);
  }

  .app {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* --- Sidebar de navegação (scroll vertical), recolhível --------------- */

  .sidebar {
    width: 280px;
    flex: 0 0 auto;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--color-bg-surface);
    border-right: 1px solid var(--color-border);
    padding-bottom: 24px;
    transition: width 0.18s ease;
  }

  .app.sidebar-collapsed .sidebar {
    width: 0;
    border-right: none;
  }

  .sidebar-toggle {
    position: absolute;
    top: 10px;
    left: 280px;
    transform: translateX(-50%);
    z-index: 5;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    background: #fff;
    box-shadow: 0 2px 6px rgba(29, 29, 27, 0.14);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--color-text-primary);
    transition: left 0.18s ease;
    padding: 0;
  }

  .sidebar-toggle:hover {
    background: var(--color-bg-muted);
  }

  .app.sidebar-collapsed .sidebar-toggle {
    left: 8px;
    transform: none;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 16px;
    font-weight: 700;
    border-bottom: 2px solid var(--color-primary);
    position: sticky;
    top: 0;
    background: var(--color-bg-surface);
    z-index: 1;
  }

  .sidebar-brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--color-primary);
    flex: 0 0 auto;
  }

  .sidebar-group-label {
    padding: 16px 16px 4px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-text-muted);
  }

  .sidebar-item {
    display: block;
    width: 100%;
    text-align: left;
    text-decoration: none;
    appearance: none;
    border: none;
    background: none;
    cursor: pointer;
    padding: 7px 16px 7px 18px;
    font-size: 0.8125rem;
    line-height: 1.3;
    color: var(--color-text-muted);
    border-left: 3px solid transparent;
    font-family: inherit;
    box-sizing: border-box;
  }

  .sidebar-item:hover {
    background: var(--color-bg-muted);
    color: var(--color-text-primary);
  }

  .sidebar-item.active {
    background: var(--color-bg-muted);
    border-left-color: var(--color-primary);
    color: var(--color-text-primary);
    font-weight: 700;
  }

  .sidebar-item.divider-item {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.75rem;
    padding-top: 10px;
    padding-bottom: 10px;
    color: var(--color-text-primary);
    border-left: 3px solid var(--color-primary);
  }

  /* --- Área principal ----------------------------------------------------- */

  .main {
    flex: 1 1 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* --- Slides em fluxo contínuo (scroll), não mais um-por-vez ------------ */

  main.slides {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .slide {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 28px 40px 24px;
    border-bottom: 1px solid var(--color-border);
    scroll-margin-top: 12px;
  }

  .slide-caption {
    flex: 0 0 auto;
    max-width: 900px;
  }

  .slide-caption .domain-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-inverse);
    background: var(--color-primary);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 8px;
  }

  .slide-caption h2 {
    margin: 0 0 4px;
    font-size: 1.375rem;
    font-weight: 700;
  }

  .slide-caption p {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.45;
    color: var(--color-text-muted);
  }

  .slide-figure {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .slide-figure img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    border: 1px solid var(--color-border);
    box-shadow: 0 16px 40px rgba(29, 29, 27, 0.14);
    cursor: zoom-in;
  }

  /* Slide de capa/encerramento — sem screenshot, texto centralizado */
  .slide.title-slide {
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .slide.title-slide .slide-caption {
    max-width: 640px;
  }

  .slide.title-slide h2 {
    font-size: 2.5rem;
  }

  .slide.title-slide p {
    font-size: 1.125rem;
  }

  /* Slide divisor de seção ("contracapa") */
  .slide.divider-slide {
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--color-primary);
    margin: 0;
  }

  .slide.divider-slide .slide-caption {
    max-width: 640px;
  }

  .slide.divider-slide .domain-tag {
    background: var(--color-text-inverse);
    color: var(--color-primary);
  }

  .slide.divider-slide h2 {
    font-size: 3rem;
    color: var(--color-text-inverse);
  }

  .slide.divider-slide p {
    font-size: 1.125rem;
    color: var(--color-text-inverse);
    opacity: 0.85;
  }


  /* --- Lightbox ------------------------------------------------------------ */

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 15, 14, 0.92);
    align-items: center;
    justify-content: center;
    padding: 32px;
    cursor: zoom-out;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: 4px;
  }

  .lightbox-close {
    position: fixed;
    top: 20px;
    right: 24px;
    appearance: none;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.25rem;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .sidebar-toggle { display: none; }
    .slide { padding: 20px 20px 20px; }
    .slide-caption h2 { font-size: 1.125rem; }
    .site-tabs { overflow-x: auto; }
    .site-tabs-brand { display: none; }
  }
</style>
</head>
<body>

    const slidesEl = document.getElementById('slides');
    const sidebarEl = document.getElementById('sidebar');
    const appEl = document.getElementById('app');
    const sidebarToggle = document.getElementById('sidebar-toggle');

    function slideClass(slide) {
      if (slide.type === 'divider') return 'slide divider-slide';
      if (!slide.image) return 'slide title-slide';
      return 'slide';
    }

    function renderSlides() {
      slidesEl.innerHTML = '';
      sidebarEl.innerHTML = '<div class="sidebar-brand"><span class="dot"></span> Observability Hub</div>';

      let lastGroupLabel = null;

      slides.forEach((slide, i) => {
        // --- slide em si ---
        const section = document.createElement('section');
        section.className = slideClass(slide);
        section.id = 'slide-' + i;

        const caption = document.createElement('div');
        caption.className = 'slide-caption';
        caption.innerHTML =
          (slide.domain ? `<span class="domain-tag">${slide.domain}</span>` : '') +
          `<h2>${slide.title}</h2><p>${slide.description}</p>`;
        section.appendChild(caption);

        if (slide.image) {
          const figure = document.createElement('div');
          figure.className = 'slide-figure';
          const img = document.createElement('img');
          img.src = 'images/' + slide.image;
          img.alt = slide.title;
          img.addEventListener('click', () => openLightbox(img.src, img.alt));
          figure.appendChild(img);
          section.appendChild(figure);
        }

        slidesEl.appendChild(section);

        // --- item da sidebar (âncora, igual às outras páginas do site) ---
        if (slide.type === 'divider') {
          const item = document.createElement('a');
          item.className = 'sidebar-item divider-item';
          item.href = '#slide-' + i;
          item.textContent = slide.title;
          sidebarEl.appendChild(item);
          lastGroupLabel = null;
        } else {
          const groupLabel = slide.domain || null;
          if (groupLabel && groupLabel !== lastGroupLabel) {
            const label = document.createElement('div');
            label.className = 'sidebar-group-label';
            label.textContent = groupLabel;
            sidebarEl.appendChild(label);
            lastGroupLabel = groupLabel;
          }
          if (!groupLabel) lastGroupLabel = null;

          const item = document.createElement('a');
          item.className = 'sidebar-item';
          item.href = '#slide-' + i;
          item.textContent = slide.title;
          sidebarEl.appendChild(item);
        }
      });

      setupScrollspy();
    }

    // Scrollspy: destaca no sidebar a seção visível durante o scroll —
    // root é main.slides (o próprio container com scroll), não a viewport.
    function setupScrollspy() {
      const sections = slidesEl.querySelectorAll('.slide[id]');
      const sidebarItems = sidebarEl.querySelectorAll('.sidebar-item');
      const itemById = {};
      sidebarItems.forEach((item) => {
        itemById[item.getAttribute('href').slice(1)] = item;
      });

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const item = itemById[entry.target.id];
            if (!item) return;
            if (entry.isIntersecting) {
              sidebarItems.forEach((a) => a.classList.remove('active'));
              item.classList.add('active');
              item.scrollIntoView({ block: 'nearest' });
            }
          });
        },
        { root: slidesEl, rootMargin: '-20% 0px -70% 0px' },
      );
      sections.forEach((s) => observer.observe(s));
    }

    // Estado do menu compartilhado com as outras abas do site (localStorage).
    const MENU_KEY = 'oh-site:menu-collapsed';
    function syncSidebarToggle(collapsed) {
      appEl.classList.toggle('sidebar-collapsed', collapsed);
      sidebarToggle.textContent = collapsed ? '›' : '‹';
      sidebarToggle.setAttribute('aria-label', collapsed ? 'Mostrar menu' : 'Ocultar menu');
    }
    try { syncSidebarToggle(localStorage.getItem(MENU_KEY) === '1'); } catch (e) {}
    sidebarToggle.addEventListener('click', () => {
      const collapsed = !appEl.classList.contains('sidebar-collapsed');
      syncSidebarToggle(collapsed);
      try { localStorage.setItem(MENU_KEY, collapsed ? '1' : '0'); } catch (e) {}
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightbox.addEventListener('click', closeLightbox);
    lightboxClose.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    renderSlides();
  </script>
</body>
</html>
